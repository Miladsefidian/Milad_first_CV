# پروژه‌های صفحهٔ پروژه‌ها، از جدید به قدیم. خلاصه‌ها می‌توانند Markdown داشته باشند.

- title: ریسک ژئوپلیتیک، رشد تولید ناخالص داخلی و ثبات اقتصاد کلان
  kind: پایان‌نامهٔ کارشناسی ارشد
  period: "۲۰۲۶"
  org: دانشگاه میلان
  summary: >-
    تحلیلی کمّی و بین‌کشوری از اینکه ریسک ژئوپلیتیک چگونه بر رشد تولید ناخالص داخلی و ثبات اقتصاد
    کلان اثر می‌گذارد؛ پایان‌نامهٔ دورهٔ کارشناسی ارشد من (LL.M) در رشتهٔ حقوق و توسعهٔ پایدار.
  tags: [اقتصادسنجی, تحلیل بین‌کشوری, ریسک ژئوپلیتیک, اقتصاد کلان]

- title: «کدام انقلاب زنان؟»
  kind: تحلیل داده · فینالیست
  period: "۲۰۲۶"
  org: مسابقهٔ ملی تحلیل داده، ایران
  summary: >-
    تحلیل آماری تفکیک‌شده بر اساس جنسیت از یک جنبش اجتماعی ملی. این پروژه به مرحلهٔ نهایی مسابقهٔ
    ملی تحلیل داده راه یافت.
  tags: [آمار, تحلیل جنسیتی, داده‌های اجتماعی]

- title: زمینه‌سازی حقوقی برای همسویی با اهداف توسعهٔ پایدار
  kind: پروژهٔ کارآموزی
  period: ۲۰۲۵ – ۲۰۲۶
  org: شرکت صنعتی فرد، ایران
  summary: >-
    همراه با تیم حقوقی داخلی شرکت، چارچوب‌های مقرراتی بین‌المللی و استانداردهای پایداری شرکتی را
    بررسی کردم و الزامات حقوقی همسویی رسمی یک شرکت صنعتی با اهداف توسعهٔ پایدار سازمان ملل را
    ارزیابی کردم؛ در قالب یک برنامهٔ ساختارمند ۲۰۰ ساعته.
  tags: [ESG, اهداف توسعهٔ پایدار, پایداری شرکتی, پژوهش مقرراتی]

- title: درآمدهای نفتی، یارانهٔ شرکت‌های دولتی و رقابت ناعادلانه
  kind: پژوهش
  period: ۲۰۲۴ – ۲۰۲۵
  org: وزارت امور اقتصادی و دارایی ایران
  summary: >-
    اینکه درآمدهای نفتی چگونه یارانه‌های دولت به شرکت‌های دولتی را شکل می‌دهند و این یارانه‌ها
    چگونه رقابت را برای بخش خصوصی مخدوش می‌کنند؛ پرسشی محوری برای حقوق رقابت و نظارت مقرراتی.
  tags: [حقوق رقابت, مالیهٔ عمومی, شرکت‌های دولتی, مقررات‌گذاری]

- title: تحلیل اقتصادی و ترجمه
  kind: نویسندگی
  period: ۲۰۲۰ – ۲۰۲۱
  org: روزنامه‌نگاری مستقل
  summary: >-
    نگارش گزارش‌های تحلیلی دربارهٔ روندهای اقتصاد کلان، راهبردهای سرمایه‌گذاری و پویایی بازارهای
    مالی، و ترجمه و انتشار متن اقتصادی *In Defence of Capitalism: Debunking the Myths*.
  tags: [اقتصاد کلان, بازارهای مالی, ترجمه]
