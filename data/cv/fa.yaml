# محتوای رزومه به فارسی. در صفحه‌های خانه، رزومه و تحصیلات استفاده می‌شود.

name: میلاد سفیدیان
headline: حقوق‌دان — کامپلاینس، مقررات مالی و پایداری (ESG)
location: میلان، ایتالیا

profile: >-
  وکیل دادگستری و حقوق‌دانی هستم با تجربه در حوزهٔ مقررات مالی، مدیریت ریسک‌های مقرراتی و تحریمی،
  و پایداری شرکتی (ESG). دقت حقوقی را با مهارت‌های تحلیل کمّی (روش‌های اقتصادسنجی و Stata) و شناخت
  عملی چارچوب‌های مقرراتی اروپا در زمینهٔ کامپلاینس بانکی و پایداری درمی‌آمیزم. در جست‌وجوی موقعیت
  شغلی یا کارآموزی در حوزهٔ کامپلاینس، ESG یا بخش بانکی در ایتالیا هستم.

glance:
  - label: محل زندگی
    value: میلان، ایتالیا
  - label: صلاحیت حرفه‌ای
    value: وکیل دادگستری، کانون وکلای دادگستری مرکز — در میان ۲٪ برتر بیش از ۸۱٬۰۰۰ داوطلب
  - label: تحصیلات
    value: کارشناسی ارشد حقوق (LL.M) در رشتهٔ حقوق و توسعهٔ پایدار، دانشگاه میلان
  - label: حوزه‌های تمرکز
    value: کامپلاینس · مقررات مالی · ESG · ریسک ژئوپلیتیک
  - label: روش‌ها
    value: Stata · داده‌های تابلویی (Panel VAR و GMM) · تحلیل بین‌کشوری
  - label: زبان‌ها
    value: فارسی (زبان مادری) · انگلیسی (C1) · ایتالیایی (B1)

experience:
  - title: کارآموز حقوقی پایداری شرکتی
    org: شرکت صنعتی فرد
    place: ایران
    period: دسامبر ۲۰۲۵ – ژانویهٔ ۲۰۲۶
    points:
      - پژوهش و تحلیل چارچوب‌های مقرراتی بین‌المللی و استانداردهای پایداری شرکتی، با همکاری تیم حقوقی داخلی شرکت.
      - ارزیابی الزامات حقوقی لازم برای همسویی رسمی با اهداف توسعهٔ پایدار (SDGs) در یک محیط شرکتی صنعتی.
      - به‌کارگیری مستقیم چارچوب‌های دورهٔ کارشناسی ارشد حقوق (LL.M) در راهبرد حقوقی واقعی شرکت، در قالب یک برنامهٔ ساختارمند ۲۰۰ ساعته.
  - title: وکیل دادگستری و مشاور حقوقی شرکت
    org: کانون وکلای دادگستری مرکز و شرکت اطمینان انرژی
    period: مارس ۲۰۲۱ – نوامبر ۲۰۲۳
    points:
      - مشاور حقوقی اصلی یک شبکهٔ بزرگ توزیع فرآورده‌های نفتی و جایگاه‌های سوخت، با مسئولیت انطباق با مقررات و مدیریت ریسک عملیاتی در بخشی به‌شدت تحت نظارت.
      - مشاوره دربارهٔ ساختارهای قراردادی مالی و مواجهه با ریسک‌های مقرراتی و تحریمی در بخشی سرمایه‌بر.
      - تنظیم، بازبینی و مذاکرهٔ قراردادهای تجاری پیچیده، قراردادهای تأمین‌کنندگان و سیاست‌های استخدامی.
      - کسب رتبه در میان ۲٪ برتر بیش از ۸۱٬۰۰۰ داوطلب آزمون وکالت کانون وکلای دادگستری مرکز.
  - title: تحلیلگر حقوقی-اقتصادی و روزنامه‌نگار مستقل
    period: مارس ۲۰۲۰ – ژانویهٔ ۲۰۲۱
    points:
      - نگارش گزارش‌های تحلیلی دربارهٔ روندهای اقتصاد کلان، راهبردهای سرمایه‌گذاری و پویایی بازارهای مالی.
      - "ترجمه و انتشار متن اقتصادی *In Defence of Capitalism: Debunking the Myths*."

